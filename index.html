<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ICT CHEERLEADER UP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>

<link rel="shortcut icon" href="photo/logo2.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<script>
// HERO
fetch("http://localhost/admin/content.json")
.then(r=>r.json())
.then(d=>{
 document.getElementById("siteTitle").innerText=d.title;
 document.getElementById("siteGen").innerText=d.gen;
 document.getElementById("siteDesc").innerText=d.desc;
});

// ACTIVITIES
fetch("http://localhost/admin/api/activities.php")
.then(r=>r.json())
.then(data=>{
 let html="";
 data.forEach(a=>{
 html+=`
 <div class="activity-card">
   <img src="http://localhost/admin/uploads/${a.image}">
   <div class="activity-name">${a.title}</div>
 </div>
 `;
 });
 document.getElementById("activities").innerHTML=html;
});
</script>

<header class="top-nav">

<div class="nav-left">
<a href="#home">Home</a>
<a href="#activity">Activity</a>
<a href="#member">Members</a>
</div>

<div class="nav-center">
<img src="photo/IMG_5501.PNG" class="logo">
</div>

<div class="nav-right social">
<a href="#"><i class="fab fa-facebook-f"></i></a>
<a href="#"><i class="fab fa-instagram"></i></a>
<a href="#"><i class="fab fa-tiktok"></i></a>
</div>

</header>

<section class="hero"></section>

<section class="teaser-section">
<div class="teaser-wrap">
<div class="label" id="siteTitle"></div>
<div class="title" id="siteGen"></div>
<div class="desc" id="siteDesc"></div>
</div>
</section>

<section class="activity-section" id="activity">
<h2 class="activity-title">ACTIVITIES</h2>
<div class="activity-grid" id="activities"></div>
</section>

<footer class="site-footer">
<div class="footer-bottom">
© 2026 ICT CHEERLEADER UP · All Rights Reserved
</div>
</footer>

</body>
</html>
