<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheerleader Registration</title>

<link rel="shortcut icon" href="photo/logo2.png">

<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="ApplyForMembership.css">

</head>

<body>

<div class="register-wrap">

<form
action="https://script.google.com/macros/s/AKfycbxT3vcXxigxLRaVNQBGJDk0-3nQRDNeDrbynlEUnea3cerf60UMriNNwRTthxsbq1US/exec"
method="POST"
class="register-card"
id="regForm">

<img src="photo/IMG_5501.PNG" class="form-logo">

<h1>ICT CHEERLEADER</h1>
<p class="subtitle">Leadership Registration</p>

<div class="grid">

<input name="fullname" placeholder="Full Name" required>
<input name="nickname" placeholder="Nickname" required>

<input name="student_id" placeholder="Student ID" required>
<input name="contact" placeholder="Contact" required>

</div>

<textarea name="reason" placeholder="Why do you want to join?" required></textarea>

<label class="upload-box">
<input type="file" id="photo" accept="image/*" required>
<span id="fileName">Upload Portrait Photo</span>
</label>

<button type="submit" id="submitBtn">SUBMIT APPLICATION</button>

</form>

</div>

<script>

const form = document.getElementById('regForm');
const submitBtn = document.getElementById('submitBtn');
const fileInput = document.getElementById('photo');
const fileNameText = document.getElementById('fileName');

function checkFormWindow(){

const openDate = new Date('2026-01-1T09:00:00');
const closeDate = new Date('2026-06-30T23:59:00');
const now = new Date();

if(now < openDate){
submitBtn.disabled = true;
submitBtn.innerText = "COMING SOON";
}

if(now > closeDate){
submitBtn.disabled = true;
submitBtn.innerText = "CLOSED";
}

}

window.onload = checkFormWindow;

fileInput.addEventListener('change',()=>{
if(fileInput.files.length){
fileNameText.innerText = fileInput.files[0].name;
}
});

form.addEventListener('submit',e=>{
e.preventDefault();

submitBtn.innerText="UPLOADING...";
submitBtn.disabled=true;

const file=fileInput.files[0];
const reader=new FileReader();

reader.onload=()=>{

fetch(form.action,{
method:'POST',
body:JSON.stringify({
base64:reader.result.split(',')[1],
type:file.type,
name:file.name,
fullname:form.fullname.value,
nickname:form.nickname.value,
student_id:form.student_id.value,
contact:form.contact.value,
reason:form.reason.value
})
}).then(()=>window.location="success.html");

};

reader.readAsDataURL(file);

});

</script>

</body>
</html>
